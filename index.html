<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="Data & AI/ML Engineer portfolio">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- Design tokens (your colours) ---------- */
  :root {
    --navy: #213448;
    --blue: #547792;
    --sky: #94b4c1;
    --skin: #eae0cf;
    --surface: #f6f1e8;
    --navy-2: #2a4058;      /* raised panel on navy */
    --ink-muted: #3e5468;   /* secondary text on light grounds */
    --white: #ffffff;
    --radius-sm: 10px;
    --radius-md: 14px;
    --display: "Space Grotesk", system-ui, sans-serif;
    --sans: "Inter", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--surface); color: var(--navy); font-family: var(--sans); font-size: 16px; line-height: 1.6; }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  .wrap { max-width: 1200px; margin: 0 auto; }
  section { padding: 96px 24px; scroll-margin-top: 16px; }
  .dark { background: var(--navy); color: var(--skin); }
  .band { background: var(--skin); }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
  .dark .eyebrow { color: var(--sky); }
  h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; }
  h2 { font-size: clamp(2rem, 4vw, 2.75rem); line-height: 1.05; letter-spacing: -.02em; }
  h3 { font-size: 22px; line-height: 1.25; }
  p { margin: 0; }
  .muted { color: var(--ink-muted); }
  .head { display: flex; flex-direction: column; gap: 12px; max-width: 720px; margin-bottom: 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
  .btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border-radius: 999px; font-weight: 600; font-size: 15px; text-decoration: none; }
  .btn-light { background: var(--skin); color: var(--navy); }
  .btn-light:hover { background: var(--white); }
  .btn-ghost { border: 1px solid var(--sky); color: var(--skin); font-weight: 500; }
  .btn-ghost:hover { background: var(--navy-2); }

  /* ---------- Nav ---------- */
  header { background: var(--navy); color: var(--skin); }
  nav { max-width: 1200px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .mark { width: 36px; height: 36px; border-radius: 10px; background: var(--sky); color: var(--navy); display: grid; place-items: center; font-family: var(--display); font-weight: 600; }
  .brand-name { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: -.01em; }
  .nav-links { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px; font-size: 15px; }
  .nav-links a { text-decoration: none; padding: 10px 0; }
  .nav-links a:hover { color: var(--sky); }
  .nav-links .btn { padding: 0 18px; min-height: 44px; font-weight: 500; }
  .nav-links .btn:hover { color: var(--navy); }

  /* ---------- Hero ---------- */
  #top { padding-top: 48px; }
  .hero-text { display: flex; flex-direction: column; gap: 24px; max-width: 820px; margin-bottom: 48px; }
  .hero-text .eyebrow { color: var(--sky); }
  h1 { font-size: clamp(2.6rem, 6vw, 4.5rem); line-height: .98; letter-spacing: -.03em; }
  .lead { font-size: 19px; line-height: 1.55; max-width: 640px; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
  .pipeline { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 24px; border: 1px solid var(--ink-muted); border-radius: var(--radius-md); list-style: none; margin: 0; }
  .pipeline li { flex: 1 1 150px; padding: 16px; border-radius: var(--radius-sm); background: var(--navy-2); display: flex; flex-direction: column; gap: 4px; position: relative; }
  .pipeline li:nth-last-child(2) { background: var(--blue); color: var(--white); }
  .pipeline li:last-child { background: var(--sky); color: var(--navy); }
  .pipeline .step { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--sky); }
  .pipeline li:nth-last-child(2) .step { color: var(--white); }
  .pipeline li:last-child .step { color: var(--navy); }
  .pipeline .arrow { flex: 0 0 32px; height: 2px; background: var(--sky); padding: 0; border-radius: 0; }

  /* ---------- Cards ---------- */
  .card { background: var(--skin); border-radius: var(--radius-md); padding: 32px; display: flex; flex-direction: column; gap: 12px; }
  .card.is-dark { background: var(--navy); color: var(--skin); }
  .card.is-dark .eyebrow, .card.is-dark .muted { color: var(--sky); }
  .card.outline { background: transparent; border: 1px solid var(--sky); }
  a.card { text-decoration: none; }
  a.card:hover { background: var(--skin); }

  /* ---------- Projects ---------- */
  .work-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 40px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .filters button { font: 500 14px var(--sans); min-height: 44px; padding: 0 18px; border-radius: 999px; cursor: pointer; background: transparent; color: var(--navy); border: 1px solid var(--sky); }
  .filters button[aria-pressed="true"] { background: var(--navy); color: var(--skin); border-color: var(--navy); }
  .projects { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .project { background: var(--white); border: 1px solid var(--sky); border-radius: var(--radius-md); padding: 32px; display: flex; flex-direction: column; gap: 16px; min-height: 360px; }
  .project[hidden] { display: none; }
  .project .meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .pill { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--skin); }
  .year { font-family: var(--mono); font-size: 13px; color: var(--ink-muted); }
  .project h3 { font-size: 24px; letter-spacing: -.01em; }
  .metric { display: flex; flex-direction: column; gap: 2px; padding: 16px; border-radius: var(--radius-sm); background: var(--surface); }
  .metric b { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.1; }
  .metric span { font-size: 14px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
  .tag { font-family: var(--mono); font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--sky); }
  .project .more { font-weight: 600; font-size: 15px; text-decoration: none; padding: 10px 0; }
  .project .more:hover { text-decoration: underline; }
  .project.featured { background: var(--navy); color: var(--skin); border-color: var(--navy); }
  .project.featured .pill { background: var(--sky); color: var(--navy); }
  .project.featured .year { color: var(--sky); }
  .project.featured .metric { background: var(--navy-2); }

  /* ---------- Experience ---------- */
  .exp { display: flex; flex-wrap: wrap; gap: 48px; }
  .exp .head { flex: 1 1 280px; margin: 0; }
  .timeline { flex: 999 1 560px; min-width: 0; list-style: none; margin: 0; padding: 0 0 0 28px; border-left: 2px solid var(--sky); display: flex; flex-direction: column; gap: 40px; }
  .timeline > li { position: relative; display: flex; flex-direction: column; gap: 8px; }
  .timeline > li::before { content: ""; position: absolute; left: -37px; top: 6px; width: 16px; height: 16px; border-radius: 999px; background: var(--navy); border: 3px solid var(--skin); }
  .timeline > li:nth-child(2)::before { background: var(--blue); }
  .timeline > li:nth-child(n+3)::before { background: var(--sky); }
  .dates { font-family: var(--mono); font-size: 13px; color: var(--ink-muted); }
  .timeline ul { margin: 4px 0 0; padding-left: 20px; }

  /* ---------- Stack ---------- */
  .stack-group { border: 1px solid var(--sky); border-radius: var(--radius-md); padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .stack-group h3 { font-size: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-family: var(--mono); font-size: 13px; padding: 6px 12px; border-radius: 999px; background: var(--skin); }

  /* ---------- Contact ---------- */
  #contact { padding-bottom: 48px; }
  .contact-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 32px; margin-bottom: 48px; }
  .contact-row .head { margin: 0; max-width: 680px; }
  .contact-row h2 { font-size: clamp(2.2rem, 5vw, 3.5rem); line-height: 1.02; letter-spacing: -.03em; }
  footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; padding-top: 24px; border-top: 1px solid var(--ink-muted); font-size: 14px; color: var(--sky); }
  footer .links { display: flex; flex-wrap: wrap; gap: 24px; }
  footer a { color: var(--skin); text-decoration: none; padding: 10px 0; }
  footer a:hover { color: var(--sky); }

  @media (max-width: 640px) {
    section { padding: 64px 16px; }
    nav { padding: 16px; }
    .pipeline .arrow { display: none; }
    .card, .project { padding: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>

<header>
  <nav aria-label="Main">
    <a class="brand" href="#top"><span class="mark" data-bind="initials"></span><span class="brand-name" data-bind="name"></span></a>
    <div class="nav-links">
      <a href="#work">Work</a>
      <a href="#experience">Experience</a>
      <a href="#stack">Stack</a>
      <a href="#education">Education</a>
      <a class="btn btn-light" href="#contact">Get in touch</a>
    </div>
  </nav>
</header>

<main>
  <section id="top" class="dark">
    <div class="wrap">
      <div class="hero-text">
        <span class="eyebrow" data-bind="hero.label"></span>
        <h1 data-bind="hero.headline"></h1>
        <p class="lead" data-bind="hero.intro"></p>
        <div class="actions">
          <a class="btn btn-light" href="#work">See my work</a>
          <a class="btn btn-ghost" data-href="links.cv" download>Download CV</a>
        </div>
      </div>
      <ol class="pipeline" id="pipeline" aria-label="How data flows into a model"></ol>
    </div>
  </section>

  <section id="focus" style="padding-bottom: 48px;">
    <div class="wrap">
      <div class="head">
        <span class="eyebrow" data-bind="focus.eyebrow"></span>
        <h2 data-bind="focus.heading"></h2>
      </div>
      <div class="grid" id="focus-cards"></div>
    </div>
  </section>

  <section id="work" style="padding-top: 48px;">
    <div class="wrap">
      <div class="work-head">
        <div class="head" style="margin: 0;">
          <span class="eyebrow">Selected work</span>
          <h2>Things I've built</h2>
        </div>
        <div class="filters" role="group" aria-label="Filter projects" id="filters"></div>
      </div>
      <div class="grid projects" id="projects"></div>
    </div>
  </section>

  <section id="experience" class="band">
    <div class="wrap exp">
      <div class="head">
        <span class="eyebrow">Experience</span>
        <h2 data-bind="experience.heading"></h2>
        <p class="muted" data-bind="experience.intro"></p>
      </div>
      <ol class="timeline" id="timeline"></ol>
    </div>
  </section>

  <section id="stack">
    <div class="wrap">
      <div class="head">
        <span class="eyebrow">Tech stack</span>
        <h2>Tools I reach for</h2>
      </div>
      <div class="grid" id="stack-groups" style="grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));"></div>
    </div>
  </section>

  <section id="education" style="padding-top: 0;">
    <div class="wrap">
      <div class="head">
        <span class="eyebrow">Education</span>
        <h2>Education &amp; certifications</h2>
      </div>
      <div class="grid" id="edu"></div>
    </div>
  </section>

  <section id="contact" class="dark">
    <div class="wrap">
      <div class="contact-row">
        <div class="head">
          <span class="eyebrow">Contact</span>
          <h2 data-bind="contact.heading"></h2>
        </div>
        <a class="btn btn-light" id="email-btn"></a>
      </div>
      <footer>
        <span id="copyright"></span>
        <div class="links">
          <a data-href="links.github" target="_blank" rel="noopener">GitHub</a>
          <a data-href="links.linkedin" target="_blank" rel="noopener">LinkedIn</a>
          <a data-href="links.cv" download>CV (PDF)</a>
        </div>
      </footer>
    </div>
  </section>
</main>

<script src="content.js"></script>
<script>
(function () {
  var S = window.SITE || {};
  var get = function (path) { return path.split(".").reduce(function (o, k) { return o == null ? o : o[k]; }, S); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var $ = function (id) { return document.getElementById(id); };

  document.title = (S.name || "Portfolio") + (S.title ? " — " + S.title : "");

  // Simple text and link bindings
  document.querySelectorAll("[data-bind]").forEach(function (el) { el.textContent = get(el.dataset.bind) || ""; });
  document.querySelectorAll("[data-href]").forEach(function (el) {
    var v = get(el.dataset.href);
    if (v) el.href = v; else el.remove();
  });

  // Pipeline
  var steps = S.pipeline || [];
  $("pipeline").innerHTML = steps.map(function (s, i) {
    return (i ? '<li class="arrow" aria-hidden="true"></li>' : "") +
      '<li><span class="step">' + esc(s.label) + "</span><span>" + esc(s.text) + "</span></li>";
  }).join("");

  // Focus cards
  $("focus-cards").innerHTML = ((S.focus && S.focus.cards) || []).map(function (c) {
    return '<div class="card' + (c.dark ? " is-dark" : "") + '"><span class="eyebrow">' + esc(c.label) +
      "</span><h3>" + esc(c.title) + '</h3><p class="' + (c.dark ? "" : "muted") + '">' + esc(c.text) + "</p></div>";
  }).join("");

  // Projects + filters
  var projects = S.projects || [];
  $("projects").innerHTML = projects.map(function (p) {
    return '<article class="project' + (p.featured ? " featured" : "") + '" data-kind="' + esc(p.kind) + '">' +
      '<div class="meta"><span class="pill">' + esc(p.kind) + '</span><span class="year">' + esc(p.year) + "</span></div>" +
      "<h3>" + esc(p.title) + "</h3>" +
      (p.summary ? "<p" + (p.featured ? "" : ' class="muted"') + ">" + esc(p.summary) + "</p>" : "") +
      (p.metric ? '<div class="metric"><b>' + esc(p.metric) + "</b><span>" + esc(p.metricLabel) + "</span></div>" : "") +
      '<div class="tags">' + (p.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("") + "</div>" +
      (p.link ? '<a class="more" href="' + esc(p.link) + '" target="_blank" rel="noopener">' + esc(p.linkText || "Read more →") + "</a>" : "") +
      "</article>";
  }).join("");

  var kinds = ["All"];
  projects.forEach(function (p) { if (p.kind && kinds.indexOf(p.kind) < 0) kinds.push(p.kind); });
  var filters = $("filters");
  if (kinds.length > 2) {
    filters.innerHTML = kinds.map(function (k, i) {
      return '<button type="button" aria-pressed="' + (i === 0) + '" data-kind="' + esc(k) + '">' + esc(k) + "</button>";
    }).join("");
    filters.addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      var k = b.dataset.kind;
      filters.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
      document.querySelectorAll(".project").forEach(function (card) { card.hidden = !(k === "All" || card.dataset.kind === k); });
    });
  } else { filters.remove(); }

  // Experience
  $("timeline").innerHTML = ((S.experience && S.experience.items) || []).map(function (x) {
    var hl = x.highlights || [];
    return '<li><span class="dates">' + esc(x.dates) + "</span>" +
      "<h3>" + esc(x.role) + (x.company ? " · " + esc(x.company) : "") + "</h3>" +
      (x.summary ? '<p class="muted">' + esc(x.summary) + "</p>" : "") +
      (hl.length ? "<ul>" + hl.map(function (h) { return "<li>" + esc(h) + "</li>"; }).join("") + "</ul>" : "") +
      "</li>";
  }).join("");

  // Stack
  $("stack-groups").innerHTML = (S.stack || []).map(function (g) {
    return '<div class="stack-group"><h3>' + esc(g.name) + '</h3><div class="chips">' +
      (g.items || []).map(function (s) { return '<span class="chip">' + esc(s) + "</span>"; }).join("") + "</div></div>";
  }).join("");

  // Education & certifications
  var edu = S.education || {};
  var degreeHtml = (edu.degrees || []).map(function (d, i) {
    var dark = i === 0;
    return '<div class="card' + (dark ? " is-dark" : "") + '"><span class="eyebrow">' + esc(d.type) + (d.year ? " · " + esc(d.year) : "") +
      "</span><h3>" + esc(d.title) + "</h3><p>" + esc(d.school) + "</p>" +
      (d.note ? '<p class="muted" style="font-size:14px">' + esc(d.note) + "</p>" : "") + "</div>";
  }).join("");
  var certHtml = (edu.certifications || []).map(function (c) {
    var tag = c.link ? "a" : "div";
    return "<" + tag + ' class="card outline"' + (c.link ? ' href="' + esc(c.link) + '" target="_blank" rel="noopener"' : "") + ">" +
      '<span class="eyebrow">Certificate' + (c.issuer ? " · " + esc(c.issuer) : "") + (c.year ? " · " + esc(c.year) : "") + "</span>" +
      "<h3>" + esc(c.title) + "</h3>" +
      (c.note ? '<p class="muted" style="font-size:14px">' + esc(c.note) + "</p>" : "") +
      (c.link ? '<span style="font-weight:600;font-size:15px;margin-top:auto;padding-top:8px">View certificate →</span>' : "") +
      "</" + tag + ">";
  }).join("");
  $("edu").innerHTML = degreeHtml + certHtml;

  // Contact
  var btn = $("email-btn");
  if (S.email) { btn.href = "mailto:" + S.email; btn.textContent = S.email; } else { btn.remove(); }
  $("copyright").textContent = "© " + new Date().getFullYear() + " " + (S.name || "");
})();
</script>
</body>
</html>
